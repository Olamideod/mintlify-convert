# INACTIVE: this workflow cannot publish anything until the repo owner configures
# PyPI trusted publishing (a trusted publisher for this repo, workflow and the
# "pypi" environment) and sets required reviewers on the "pypi" GitHub environment.
# It runs only when a GitHub release is published; nothing runs on push.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install and test
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pytest tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Build package
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check dist/*
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI (trusted publishing)
      uses: pypa/gh-action-pypi-publish@release/v1
